services:
  - type: web
    name: preventvital-backend
    env: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --app-dir .
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHAT_PROVIDER
        value: auto
